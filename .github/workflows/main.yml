name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cartpvp
    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10

      - name: Build
        run: gradle build

      - name: Upload file jar
        uses: actions/upload-artifact@v4
        with:
          name: cartpvp-mod
          path: |
            cartpvp/build/libs/*.jar
            !cartpvp/build/libs/*-sources.jar
