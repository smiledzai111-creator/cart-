name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cartpvp
    steps:
      - uses: actions/checkout@v4

      - name: Cài JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài Gradle 8.10
        run: |
          cd ~
          wget -q https://services.gradle.org/distributions/gradle-8.10-bin.zip
          unzip -q gradle-8.10-bin.zip
          echo "$HOME/gradle-8.10/bin" >> $GITHUB_PATH

      - name: Build
        run: |
          gradle --version
          gradle build --no-daemon

      - name: Upload file jar
        uses: actions/upload-artifact@v4
        with:
          name: cartpvp-mod
          path: |
            cartpvp/build/libs/*.jar
            !cartpvp/build/libs/*-sources.jar
